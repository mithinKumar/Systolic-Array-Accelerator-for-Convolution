name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake

      - name: Build and run tests with Make
        run: |
          make -C c_code_simulation all
          make -C c_code_simulation test

      - name: Build and run tests with CMake
        run: |
          cmake -B build -S .
          cmake --build build
          ctest --test-dir build --output-on-failure

  lint:
    name: Code Formatting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code formatting
        run: make -C c_code_simulation lint

  security-audit:
    name: Security & Static Analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck Analysis
        run: |
          cppcheck --enable=all --error-exitcode=1 --inconclusive --suppress=missingIncludeSystem c_code_simulation/
