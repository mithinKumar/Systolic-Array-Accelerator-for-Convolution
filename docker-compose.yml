version: '3.8'

services:
  simulation:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: systolic-array-sim
    healthcheck:
      test: ["CMD", "./test_runner"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    container_name: systolic-array-test
    profiles:
      - test
